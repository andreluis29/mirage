<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Segurança: só scripts e estilos do próprio site; fontes do Google; nenhuma conexão externa. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F2EBDD">
  <title>Mirage — um caderno de paisagens</title>
  <meta name="description" content="Mirage: paisagens do mundo desenhadas à mão, a lápis, atravessadas por um viajante.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Kalam:wght@300;400&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="stage" id="stage">
    <!-- Paisagem: desenhada em canvas -->
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>

    <!-- O viajante: figura em SVG, 7,5 cabeças de altura, pés na origem (0,0) -->
    <svg id="traveler" class="traveler" aria-hidden="true" focusable="false">
      <defs>
        <!-- tremor de lápis: desloca levemente o traço -->
        <filter id="tv-pencil" x="-40%" y="-15%" width="180%" height="130%">
          <feTurbulence id="tv-noise" type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <pattern id="tv-hatch" width="1.8" height="1.8" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
          <rect width="1.8" height="1.8" fill="#E6DCC8"/>
          <line x1="0.4" y1="0" x2="0.4" y2="1.8" stroke="#5A534C" stroke-width="0.5"/>
        </pattern>
        <pattern id="tv-hatch-dark" width="1.5" height="1.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
          <rect width="1.5" height="1.5" fill="#8C847A"/>
          <line x1="0.4" y1="0" x2="0.4" y2="1.5" stroke="#2B2724" stroke-width="0.55"/>
        </pattern>
      </defs>

      <g id="tv" class="tv" filter="url(#tv-pencil)" transform="translate(-300 -300)">
        <ellipse id="tv-shadow" class="tv-shadow" cx="1" cy="0.6" rx="10" ry="1.5"/>

        <!-- braço de trás (atrás de tudo) -->
        <g id="tv-upper-back">
          <path id="tv-armB-o" class="tv-arm-o"/>
          <path id="tv-armB-i" class="tv-arm-back"/>
          <circle id="tv-handB" class="tv-hand" r="1.5"/>
        </g>

        <!-- pernas -->
        <path id="tv-legB-o" class="tv-leg-o"/>
        <path id="tv-legB-i" class="tv-leg-back"/>
        <path id="tv-bootB" class="tv-boot"/>
        <path id="tv-legF-o" class="tv-leg-o"/>
        <path id="tv-legF-i" class="tv-leg-front"/>
        <path id="tv-bootF" class="tv-boot"/>

        <!-- tronco, mochila, cabeça e braço da frente -->
        <g id="tv-upper">
          <path class="tv-pack" d="M-12.2 -57.5 Q-12.6 -60.6 -9.6 -60.8 L-4.2 -60.6 L-4 -41.5 L-10.2 -41.2 Q-12.8 -41.4 -12.6 -44.2 Z"/>
          <path class="tv-line" d="M-11.8 -49.2 L-5.4 -49"/>
          <ellipse class="tv-roll" cx="-8.2" cy="-62.6" rx="4.8" ry="2.1"/>
          <path class="tv-line thin" d="M-10.6 -62.3 Q-8.2 -61.1 -6 -62.6"/>
          <path class="tv-coat" d="M-4.6 -61.2 C-6.2 -55 -6.4 -45 -7 -31.5 Q0 -30.2 6.4 -31.8 C5.8 -41 6.2 -52 4.6 -60.4 Q0.4 -63.4 -4.6 -61.2 Z"/>
          <path class="tv-line" d="M-6.2 -41.2 Q0 -40 5.9 -41.6"/>
          <path class="tv-line thin" d="M4.4 -58 Q5.2 -48 5.6 -33"/>
          <path class="tv-strap" d="M-3.8 -60 Q1.6 -58.4 2.6 -50.5"/>
          <path id="tv-scarf" class="tv-scarf" d="M-3.2 -62.4 Q-8 -63 -11.5 -61 T-16 -58.6"/>
          <g id="tv-head">
            <path class="tv-skin" d="M-0.5 -65 L-0.7 -62.1 L2.7 -62.1 L2.5 -65 Z"/>
            <ellipse class="tv-skin" cx="1.4" cy="-69.4" rx="4.1" ry="4.7"/>
            <path class="tv-line" d="M5.3 -70.6 L6.7 -68.6 L5.3 -68.1"/>
            <circle class="tv-eye" cx="3.9" cy="-70.3" r="0.45"/>
            <path class="tv-line thin" d="M0.3 -70.6 q-1.1 1.1 0 2.3"/>
            <path class="tv-hair" d="M-2.5 -71.6 Q-3.4 -67.6 -1.6 -65.6"/>
            <path class="tv-hat" d="M-3.9 -73.4 C-4.4 -79.6 6 -80 5.8 -73.4 Z"/>
            <path class="tv-band" d="M-4 -74.7 L5.9 -74.7"/>
            <path class="tv-brim" d="M-8.8 -72.9 Q1 -75.4 11.2 -72.6"/>
          </g>
          <path class="tv-scarf" d="M-3.6 -62.6 Q1 -60.4 4.6 -62.2"/>
          <path id="tv-armF-o" class="tv-arm-o"/>
          <path id="tv-armF-i" class="tv-arm-front"/>
          <circle id="tv-handF" class="tv-hand" r="1.5"/>
        </g>
      </g>
    </svg>

    <!-- textura de papel e vinheta -->
    <div class="paper" aria-hidden="true"></div>

    <header class="masthead">
      <h1 class="title">Mirage</h1>
      <svg class="underline" viewBox="0 0 120 10" aria-hidden="true" focusable="false"><path d="M2 6 C 28 2, 62 9, 118 3.5"/></svg>
      <p class="tagline">um caderno de paisagens do mundo</p>
    </header>

    <p class="label" id="label" aria-live="polite">
      <span class="label-num" id="label-num">I</span>
      <span class="label-text">
        <span class="label-place" id="label-place">Geirangerfjord</span>
        <span class="label-meta" id="label-meta">Noruega · 62°06′N 7°06′E</span>
      </span>
    </p>

    <nav class="controls" aria-label="Navegação entre paisagens">
      <button class="btn" id="btn-prev" type="button" aria-label="Paisagem anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 5.5 C11 8.5 9.5 10.5 8.6 12.1 C9.8 13.8 11.6 15.8 14.8 18.6"/></svg>
      </button>
      <button class="btn" id="btn-play" type="button" aria-label="Pausar" aria-pressed="false">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.2 6.4 C9 10 9.3 14 9 17.6 M15 6.2 C15.2 10 14.8 14 15.1 17.8"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.6 6 C8.4 10 8.7 14 8.5 18.2 C12 16 15 14 17.6 12.1 C14.6 10 11.6 8 8.6 6 Z"/></svg>
      </button>
      <button class="btn" id="btn-next" type="button" aria-label="Próxima paisagem">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 5.5 C13 8.5 14.5 10.5 15.4 12.1 C14.2 13.8 12.4 15.8 9.2 18.6"/></svg>
      </button>
      <ol class="dots" id="dots"></ol>
    </nav>
  </main>

  <noscript><p class="noscript">Mirage precisa de JavaScript para desenhar as paisagens.</p></noscript>
</body>
</html>
